<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Quick Answer for Claude – Einstellungen</title>
  <link rel="stylesheet" href="../sidebar/sidebar.css">
  <style>
    body { max-width: 640px; margin: 0 auto; padding: 24px 16px; font-size: 14px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    label { display: grid; gap: 4px; margin-bottom: 14px; font-weight: 600; }
    .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
    input[type=password], input[type=number], select, textarea {
      font: inherit; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px;
    }
    textarea { min-height: 140px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
    #status { margin-left: 8px; }
    .ok { color: #2e7d32; } .err { color: var(--error); }
    table { border-collapse: collapse; margin-top: 8px; }
    td { padding: 2px 12px 2px 0; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Quick Answer for Claude</h1>

  <label>Anthropic API-Key
    <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…">
    <span class="hint">Wird nur lokal in diesem Firefox-Profil gespeichert (storage.local) und nur an api.anthropic.com gesendet.</span>
  </label>

  <label>Modell
    <select id="model">
      <option value="claude-opus-5-5">Claude Opus 5.5 – beste Qualität</option>
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5 – schneller, günstiger</option>
      <option value="claude-haiku-5-5">Claude Haiku 5.5 – am schnellsten</option>
    </select>
  </label>

  <label>Denktiefe (effort)
    <select id="effort">
      <option value="low">low – schnell (empfohlen für kurze Antworten)</option>
      <option value="medium">medium</option>
      <option value="high">high – gründlicher, langsamer</option>
    </select>
    <span class="hint">Höhere Stufen helfen bei kniffligen Rechen- oder Logikaufgaben, dauern aber länger.</span>
  </label>

  <label>System-Prompt
    <textarea id="systemPrompt"></textarea>
    <span class="hint"><button type="button" id="resetPrompt" class="ghost">Standard wiederherstellen</button></span>
  </label>

  <label>Max. Einträge im Verlauf
    <input id="maxHistory" type="number" min="10" max="2000" step="10">
  </label>

  <label class="check"><input id="showToast" type="checkbox"> Antwort-Popup unten rechts auf der Seite anzeigen</label>

  <div class="row">
    <button id="save">Speichern</button>
    <button id="test" class="ghost">Verbindung testen</button>
    <span id="status"></span>
  </div>

  <h2 style="font-size:16px;margin-top:28px">Tastenkürzel</h2>
  <p class="hint">Ins Feld klicken und die neue Kombination drücken. Erlaubt sind <code>Ctrl</code> und/oder <code>Alt</code>,
    optional <code>Shift</code>, plus eine Taste (Buchstabe, Ziffer, F1–F12, Pfeile …). <code>Esc</code> bricht ab,
    <code>Backspace</code> entfernt das Kürzel. Änderungen gelten sofort.</p>
  <table id="shortcuts"></table>
  <p id="sc-status" class="hint"></p>

  <template id="sc-row">
    <tr>
      <td class="desc"></td>
      <td><input class="sc-input" readonly style="width:150px;text-align:center;cursor:pointer"></td>
      <td><button class="ghost sc-reset" type="button" title="Auf Standard zurücksetzen">↺</button></td>
    </tr>
  </template>

  <script src="options.js"></script>
</body>
</html>
